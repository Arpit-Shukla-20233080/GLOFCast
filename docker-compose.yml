version: '3.8'

# ==============================================================================
# GLOFCast Glacial Lake Outburst Flood (GLOF) Early Warning System
# Orchestration: FastAPI AI Backend + Next.js Command Center Frontend
# ==============================================================================

services:
  # ─── 1. AI API Gateway (FastAPI + PyTorch + TensorFlow) ─────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: glofcast-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MODELS_DIR=/app/models
      - CSV_PATH=/app/prepared_dataset.csv
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      # Read-only mount of offline pre-trained models
      - ./src/models:/app/models:ro
      # Read-only mount of glacial lake inventory database
      - ./src/prepared_dataset.csv:/app/prepared_dataset.csv:ro
      # Live development reload mount for backend source code
      - ./src/backend:/app/backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 25s
    networks:
      - glofcast-network

  # ─── 2. Command Center Dashboard (Next.js + Leaflet + Recharts) ────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: glofcast-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - glofcast-network

# ─── Shared Bridge Network ───────────────────────────────────────────────────
networks:
  glofcast-network:
    driver: bridge
